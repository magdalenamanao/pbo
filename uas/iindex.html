<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Login - Admin System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .input-style {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .input-style:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: #34d399; /* Emerald 400 */
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md">
        
        <div id="loginSection" class="glass rounded-[2rem] p-8 text-white transition-all duration-500 transform">
            <div class="text-center mb-10">
                <div class="bg-emerald-500/30 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-emerald-400/50">
                    <i data-lucide="shield-check" class="w-8 h-8 text-emerald-400"></i>
                </div>
                <h1 class="text-3xl font-bold tracking-tight">Selamat Datang</h1>
                <p class="text-sm opacity-70 mt-2">Gunakan admin1, admin2, atau admin3</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-emerald-300"></i>
                        <input type="text" id="username" required
                            class="input-style w-full pl-11 pr-4 py-3.5 rounded-xl text-sm placeholder:text-white/40"
                            placeholder="Contoh: admin1">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-emerald-300"></i>
                        <input type="password" id="password" required
                            class="input-style w-full pl-11 pr-12 py-3.5 rounded-xl text-sm placeholder:text-white/40"
                            placeholder="Masukkan password">
                        <button type="button" onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 hover:text-emerald-300 transition">
                            <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-900/20 transition-all duration-300 active:scale-95 flex items-center justify-center gap-2">
                    LOGIN <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <div id="userSection" class="hidden glass rounded-[2rem] p-10 text-white text-center transform scale-95 transition-all duration-500">
            <div class="relative w-24 h-24 mx-auto mb-6">
                <div class="absolute inset-0 bg-emerald-400 blur-xl opacity-20 animate-pulse"></div>
                <div class="relative bg-white/10 w-full h-full rounded-full border-2 border-emerald-400 flex items-center justify-center shadow-inner">
                    <span id="avatarInitial" class="text-3xl font-bold text-emerald-400">A</span>
                </div>
            </div>
            
            <h1 class="text-3xl font-bold">Hai, <span id="displayName" class="text-emerald-400">User</span>!</h1>
            <p class="text-white/60 mt-3 text-sm leading-relaxed">
                Anda berhasil login ke sistem manajemen.<br>Nikmati hari Anda yang luar biasa.
            </p>

            <div class="mt-8 pt-8 border-t border-white/10 space-y-4">
                <div class="bg-white/5 p-4 rounded-xl flex items-center justify-between text-sm">
                    <span class="opacity-60">Status Akun</span>
                    <span class="px-2 py-1 bg-emerald-500/20 text-emerald-400 text-[10px] font-bold uppercase rounded">Aktif</span>
                </div>
                <button onclick="handleLogout()" 
                    class="w-full bg-white/10 hover:bg-red-500/20 hover:text-red-300 py-3 rounded-xl transition duration-300 border border-white/10 flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
                </button>
            </div>
        </div>

    </div>

    <script>
        // 1. Database Sederhana dalam format JSON
        const userDataJSON = [
            { username: "admin1", password: "123", fullName: "Admin Satu" },
            { username: "admin2", password: "123", fullName: "Admin Dua" },
            { username: "admin3", password: "123", fullName: "Admin Tiga" }
        ];

        // 2. Inisialisasi Database ke LocalStorage
        function initDB() {
            if (!localStorage.getItem('app_users')) {
                localStorage.setItem('app_users', JSON.stringify(userDataJSON));
                console.log("Database initialized.");
            }
        }

        // 3. Logika Login
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const userInp = document.getElementById('username').value.trim().toLowerCase();
            const passInp = document.getElementById('password').value;

            // Ambil data dari LocalStorage
            const users = JSON.parse(localStorage.getItem('app_users'));
            
            // Verifikasi
            const validUser = users.find(u => u.username === userInp && u.password === passInp);

            if (validUser) {
                showDashboard(validUser.fullName);
            } else {
                alert("❌ Gagal Login!\nUsername atau password salah.");
            }
        });

        // 4. Navigasi Halaman
        function showDashboard(name) {
            const loginBox = document.getElementById('loginSection');
            const userBox = document.getElementById('userSection');

            loginBox.classList.add('opacity-0', 'scale-90', 'hidden');
            
            userBox.classList.remove('hidden');
            setTimeout(() => {
                userBox.classList.remove('scale-95');
                userBox.classList.add('scale-100');
            }, 50);

            document.getElementById('displayName').innerText = name;
            document.getElementById('avatarInitial').innerText = name.charAt(0);
        }

        function handleLogout() {
            location.reload(); // Refresh halaman untuk reset state
        }

        // 5. Fitur Toggle Password
        function togglePass() {
            const passInp = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passInp.type === 'password') {
                passInp.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passInp.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Jalankan sistem saat load
        initDB();
        lucide.createIcons();
    </script>
</body>
</html>
